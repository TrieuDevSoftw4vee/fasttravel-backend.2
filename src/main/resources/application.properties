spring.application.name=FastTravel
server.port=8080

# SQL Server
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=FastTravelDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Time zone
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Upload file
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Frontend
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# JWT
app.jwt.secret=${JWT_SECRET:FastTravelEnterpriseJwtSecretKey2026MustHaveAtLeast32Bytes}
app.jwt.access-expiration=86400000

# Booking
app.booking.hold-minutes=15

# VNPay sandbox
